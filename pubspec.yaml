name: aivo
description: "A new Flutter project."

publish_to: 'none'


version: 1.0.0+1

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter


  cupertino_icons: ^1.0.8
  get: ^4.7.2
  flutter_dotenv: ^6.0.0
  http: ^1.5.0
  flutter_tts: ^4.2.3
  speech_to_text: ^7.3.0
  uuid: ^4.5.1
  crypto: ^3.0.6
  intl: ^0.20.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  path_provider: ^2.1.5
  google_fonts: ^6.3.0
  flutter_markdown: ^0.7.7+1
  rename_app: ^1.6.5
  flutter_native_splash: ^2.4.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.6
  flutter_launcher_icons: ^0.14.4

  flutter_lints: ^4.0.0

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/ic_aivo.jpg"
  min_sdk_android: 21

flutter:

  uses-material-design: true

  assets:
    - assets/
    - .env
